name: save-post
on:
  workflow_dispatch:
    inputs:
      url:
        description: "인스타 게시물 주소"
        required: true
      folder:
        description: "폴더 이름 (새 이름이면 자동 생성, 비우면 미분류)"
        required: false
        default: "미분류"
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 게시물 수집 (Apify)
        run: python3 scripts/collect.py "${{ github.event.inputs.url }}" "${{ github.event.inputs.folder }}"
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: 페이지 재생성
        run: python3 scripts/build.py
      - name: 저장하고 발행
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add -A
          git commit -m "저장: ${{ github.event.inputs.url }} → [${{ github.event.inputs.folder }}]" || echo "변경 없음"
          git push
